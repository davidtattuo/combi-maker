
<!DOCTYPE html>
<html lang="ja">

<head>
<link
    rel="manifest"
    href="manifest.json">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>グループ</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <h1 id="groupTitle"></h1>


    <h2>メンバーで絞り込む</h2>


    <p>
        メンバーを下のエリアにドラッグしてください
    </p>


    <div
        id="memberDragArea"
        class="member-drag-area">

    </div>


    <div
        id="selectedMembers"
        class="selected-members">

        <span class="filter-hint">
            ここにメンバーをドラッグ
        </span>

    </div>


    <button
        class="small-button"
        onclick="clearFilter()">
        絞り込みを解除
    </button>


    <div id="result"></div>


    <button
        class="back-button"
        onclick="location.href='list.html'">
        グループ一覧に戻る
    </button>


    <script>

        let savedGroups =
            JSON.parse(
                localStorage.getItem(
                    "groups"
                )
            ) || [];


        const selectedGroup =
            localStorage.getItem(
                "selectedGroup"
            );


        document
            .getElementById(
                "groupTitle"
            )
            .textContent =
            selectedGroup ||
            "グループ";


        /*
         * 現在のグループ
         */

        let selectedGroups =
            savedGroups.filter(
                function(group) {

                    return (
                        group.groupName
                        ===
                        selectedGroup
                    );

                }
            );


        const result =
            document.getElementById(
                "result"
            );


        const memberDragArea =
            document.getElementById(
                "memberDragArea"
            );


        const selectedMembersArea =
            document.getElementById(
                "selectedMembers"
            );


        /*
         * メンバー一覧
         */

        const members = [];


        for (
            let group
            of selectedGroups
        ) {

            for (
                let member
                of group.members
            ) {

                if (
                    !members.some(
                        function(existing) {

                            return (
                                existing.name
                                ===
                                member.name
                            );

                        }
                    )
                ) {

                    members.push(
                        member
                    );

                }

            }

        }


        /*
         * 選択中
         */

        let selectedNames = [];


        /*
         * ドラッグメンバー
         */

        for (
            let member
            of members
        ) {

            createDraggableMember(
                member
            );

        }


        function createDraggableMember(
            member
        ) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "draggable-member";


            card.draggable =
                true;


            const image =
                document.createElement(
                    "img"
                );


            image.src =
                member.photo;


            image.className =
                "drag-member-photo";


            const name =
                document.createElement(
                    "span"
                );


            name.textContent =
                member.name;


            card.appendChild(
                image
            );


            card.appendChild(
                name
            );


            card.addEventListener(
                "dragstart",
                function(event) {

                    event.dataTransfer.setData(
                        "text/plain",
                        member.name
                    );

                }
            );


            memberDragArea.appendChild(
                card
            );

        }


        /* =========================
           ドロップ
           ========================= */

        selectedMembersArea.addEventListener(
            "dragover",
            function(event) {

                event.preventDefault();


                selectedMembersArea.classList.add(
                    "drag-over"
                );

            }
        );


        selectedMembersArea.addEventListener(
            "dragleave",
            function() {

                selectedMembersArea.classList.remove(
                    "drag-over"
                );

            }
        );


        selectedMembersArea.addEventListener(
            "drop",
            function(event) {

                event.preventDefault();


                selectedMembersArea.classList.remove(
                    "drag-over"
                );


                const name =
                    event.dataTransfer.getData(
                        "text/plain"
                    );


                if (
                    name === ""
                ) {

                    return;

                }


                if (
                    selectedNames.includes(
                        name
                    )
                ) {

                    return;

                }


                selectedNames.push(
                    name
                );


                updateFilter();

            }
        );


        /* =========================
           フィルター更新
           ========================= */

        function updateFilter() {

            selectedMembersArea.innerHTML =
                "";


            if (
                selectedNames.length === 0
            ) {

                const hint =
                    document.createElement(
                        "span"
                    );


                hint.className =
                    "filter-hint";


                hint.textContent =
                    "ここにメンバーをドラッグ";


                selectedMembersArea.appendChild(
                    hint
                );


                displayCombinations(
                    selectedGroups
                );


                return;

            }


            /*
             * 選択メンバーを表示
             */

            for (
                let name
                of selectedNames
            ) {

                const chip =
                    document.createElement(
                        "div"
                    );


                chip.className =
                    "selected-member-chip";


                const member =
                    members.find(
                        function(member) {

                            return (
                                member.name
                                ===
                                name
                            );

                        }
                    );


                if (
                    member
                ) {

                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        member.photo;


                    chip.appendChild(
                        image
                    );

                }


                const text =
                    document.createElement(
                        "span"
                    );


                text.textContent =
                    name;


                chip.appendChild(
                    text
                );


                const remove =
                    document.createElement(
                        "button"
                    );


                remove.textContent =
                    "×";


                remove.className =
                    "remove-filter-button";


                remove.onclick =
                    function() {

                        selectedNames =
                            selectedNames.filter(
                                function(
                                    selectedName
                                ) {

                                    return (
                                        selectedName
                                        !==
                                        name
                                    );

                                }
                            );


                        updateFilter();

                    };


                chip.appendChild(
                    remove
                );


                selectedMembersArea.appendChild(
                    chip
                );

            }


            /*
             * 全員を含む組み合わせ
             */

            const filtered =
                selectedGroups.filter(
                    function(group) {

                        return selectedNames.every(
                            function(name) {

                                return group.members.some(
                                    function(member) {

                                        return (
                                            member.name
                                            ===
                                            name
                                        );

                                    }
                                );

                            }
                        );

                    }
                );


            displayCombinations(
                filtered
            );

        }


        /* =========================
           コンビ表示
           ========================= */

        function displayCombinations(
            combinations
        ) {

            result.innerHTML = "";


            if (
                combinations.length === 0
            ) {

                const message =
                    document.createElement(
                        "p"
                    );


                message.textContent =
                    "該当するコンビがありません。";


                result.appendChild(
                    message
                );


                return;

            }


            for (
                let group
                of combinations
            ) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "combination-card";


                /*
                 * コンビ名
                 */

                const nameButton =
                    document.createElement(
                        "button"
                    );


                nameButton.className =
                    "saved-combination-name-button";


                nameButton.textContent =
                    group.name ||
                    "名前なし";


                nameButton.onclick =
                    function() {

                        editCombination(
                            group
                        );

                    };


                card.appendChild(
                    nameButton
                );


                /*
                 * 写真
                 */

                const photoArea =
                    document.createElement(
                        "div"
                    );


                photoArea.className =
                    "combination-members";


                for (
                    let member
                    of group.members
                ) {

                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "combination-member";


                    const image =
                        document.createElement(
                            "img"
                        );


                    image.src =
                        member.photo;


                    image.className =
                        "combination-photo";


                    const name =
                        document.createElement(
                            "span"
                        );


                    name.textContent =
                        member.name;


                    box.appendChild(
                        image
                    );


                    box.appendChild(
                        name
                    );


                    photoArea.appendChild(
                        box
                    );

                }


                card.appendChild(
                    photoArea
                );


                /*
                 * 編集
                 */

                const editButton =
                    document.createElement(
                        "button"
                    );


                editButton.textContent =
                    "コンビ名を編集";


                editButton.className =
                    "small-button";


                editButton.onclick =
                    function() {

                        editCombination(
                            group
                        );

                    };


                card.appendChild(
                    editButton
                );


                /*
                 * 削除
                 */

                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.textContent =
                    "削除";


                deleteButton.className =
                    "small-button";


                deleteButton.onclick =
                    function() {

                        deleteCombination(
                            group
                        );

                    };


                card.appendChild(
                    deleteButton
                );


                result.appendChild(
                    card
                );

            }

        }


        displayCombinations(
            selectedGroups
        );


        /* =========================
           コンビ名編集
           ========================= */

        function editCombination(
            group
        ) {

            const newName =
                prompt(
                    "新しいコンビ名を入力してください。",
                    group.name
                );


            if (
                newName === null
            ) {

                return;

            }


            const trimmed =
                newName.trim();


            if (
                trimmed === ""
            ) {

                alert(
                    "コンビ名を入力してください。"
                );

                return;

            }


            const index =
                savedGroups.indexOf(
                    group
                );


            if (
                index !== -1
            ) {

                savedGroups[index].name =
                    trimmed;

            }


            localStorage.setItem(
                "groups",
                JSON.stringify(
                    savedGroups
                )
            );


            location.reload();

        }


        /* =========================
           コンビ削除
           ========================= */

        function deleteCombination(
            group
        ) {

            if (
                !confirm(
                    "このコンビを削除しますか？"
                )
            ) {

                return;

            }


            const index =
                savedGroups.indexOf(
                    group
                );


            if (
                index !== -1
            ) {

                savedGroups.splice(
                    index,
                    1
                );

            }


            localStorage.setItem(
                "groups",
                JSON.stringify(
                    savedGroups
                )
            );


            location.reload();

        }


        /* =========================
           絞り込み解除
           ========================= */

        function clearFilter() {

            selectedNames = [];


            updateFilter();

        }


        /* =========================
           設定
           ========================= */

        loadSettings();


        function loadSettings() {

            const fontSize =
                localStorage.getItem(
                    "fontSize"
                );


            if (
                fontSize === "large"
            ) {

                document.body.classList.add(
                    "large-font"
                );

            }


            if (
                fontSize === "small"
            ) {

                document.body.classList.add(
                    "small-font"
                );

            }


            const theme =
                localStorage.getItem(
                    "backgroundColor"
                );


            if (
                theme !== null
            ) {

                document.body.classList.add(
                    "theme-" + theme
                );

            }

        }

    </script>
<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
    }
</script>
</body>

</html>
