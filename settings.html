
<!DOCTYPE html>
<html lang="ja">

<head>
<link
    rel="manifest"
    href="manifest.json">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>設定</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <h1>設定</h1>


    <h2>文字サイズ</h2>


    <button
        onclick="increaseFont()">
        大きくする
    </button>


    <button
        onclick="decreaseFont()">
        小さくする
    </button>


    <h2>ページの色</h2>


    <button
        onclick="changeColor('white')">
        白・紫
    </button>


    <button
        onclick="changeColor('blue')">
        水色・青
    </button>


    <button
        onclick="changeColor('green')">
        緑・ミント
    </button>


    <button
        class="back-button"
        onclick="location.href='index.html'">
        ホームに戻る
    </button>


    <script>

        function increaseFont() {

            document.body.classList.add(
                "large-font"
            );


            document.body.classList.remove(
                "small-font"
            );


            localStorage.setItem(
                "fontSize",
                "large"
            );

        }


        function decreaseFont() {

            document.body.classList.add(
                "small-font"
            );


            document.body.classList.remove(
                "large-font"
            );


            localStorage.setItem(
                "fontSize",
                "small"
            );

        }


        function changeColor(
            color
        ) {

            document.body.classList.remove(
                "theme-white",
                "theme-blue",
                "theme-green"
            );


            document.body.classList.add(
                "theme-" + color
            );


            localStorage.setItem(
                "backgroundColor",
                color
            );

        }


        loadSettings();


        function loadSettings() {

            const fontSize =
                localStorage.getItem(
                    "fontSize"
                );


            if (
                fontSize === "large"
            ) {

                document.body.classList.add(
                    "large-font"
                );

            }


            if (
                fontSize === "small"
            ) {

                document.body.classList.add(
                    "small-font"
                );

            }


            const theme =
                localStorage.getItem(
                    "backgroundColor"
                );


            if (
                theme !== null
            ) {

                document.body.classList.add(
                    "theme-" + theme
                );

            }

        }

    </script>

</body>

</html>
